<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive JavaScript calculator.">
  <title>Calculator | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <div class="top"><span>CodeAlpha</span><span>Calculator</span></div>
    <div class="display">
      <div id="history"></div>
      <div id="screen" aria-live="polite">0</div>
    </div>
    <div class="keys">
      <button class="action" data-action="clear">AC</button><button class="action" data-action="delete">DEL</button><button class="operator" data-value="%">%</button><button class="operator" data-value="/">÷</button>
      <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="*">×</button>
      <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="-">−</button>
      <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
      <button class="zero" data-value="0">0</button><button data-value=".">.</button><button class="equals" data-action="equals">=</button>
    </div>
    <p class="hint">Keyboard supported · Enter = result · Esc = clear</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
